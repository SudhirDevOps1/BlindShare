  <text y="18" font-family="Inter,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.4" fill="#64748b">IN-DOC REAL-TIME Q&amp;A • FOUNDER REPLIES IN <tspan fill="#10b981">~2 MIN</tspan> • AI SUMMARIZES INTENT WITHOUT READING FILE CONTENT</text>
