</g>
<text x="480" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="#64748b">ON DOWNLOAD • BURNED INTO PDF STREAM • pdf-lib • TAMPER-EVIDENT</text>

