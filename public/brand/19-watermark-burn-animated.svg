    <g transform="translate(34,-18)"><rect x="-26" y="-10" width="52" height="20" rx="10" fill="#f59e0b"/><text x="0" y="4" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="800" fill="#080e1a">BURN</text><animate attributeName="opacity" values="1;0.62;1" dur="0.9s" repeatCount="indefinite"/></g>
