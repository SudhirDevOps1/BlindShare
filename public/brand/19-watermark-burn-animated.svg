      <rect x="16" y="82" width="92" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1"/><rect x="24" y="92" width="60" height="5" rx="2.5" fill="#f59e0b"/>
