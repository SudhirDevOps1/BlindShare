    @keyframes ultraFlow{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
    @keyframes ultraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
</defs>
<rect width="960" height="520" rx="24" fill="#080e1a"/>
<text x="480" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#fff">PERMANENT <tspan fill="#f59e0b">INDELIBLE</tspan> WATERMARK</text>
<g opacity="0.95">
