  <pattern id="diagWm" width="120" height="24" patternTransform="rotate(-28)" patternUnits="userSpaceOnUse">
    <text x="0" y="16" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#f59e0b" opacity="0.14">viewer@email.com • 2026-09-03 • bln.sh/x7f3</text>
  </pattern>

  <style>
