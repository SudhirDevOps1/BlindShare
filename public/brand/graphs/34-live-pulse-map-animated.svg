<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img">
<title>Live Active Pulse Map — Animated</title>
<rect width="960" height="360" rx="16" fill="#080e1a"/>
<text x="24" y="28" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#fff">LIVE ACTIVE PULSE MAP</text>
<text x="24" y="44" font-family="Inter,sans-serif" font-size="7" fill="#64748b">Who is reading right now — green pulse per country • P0 #5</text>
<text x="936" y="28" text-anchor="end" font-family="Inter,sans-serif" font-size="7" font-weight="800" fill="#10b981">● 3 READING NOW</text>
<g transform="translate(24,56)">
  <rect width="600" height="220" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect width="600" height="220" rx="12" fill="#020617" opacity="0.35"/>
  <!-- simplified world dots -->
  <g transform="translate(300,110)">
