<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="BlindShare Full Brand Logo Light Variant">
  <title>BlindShare — Zero-Knowledge Document Sharing (Light)</title>
  <defs>
    <!-- Radiant Cyber Gold Gradients -->
    <linearGradient id="goldGLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldStrokeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="shieldFillLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#d97706" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="640" height="160" rx="20" fill="#f8fafc" />
  <rect width="640" height="160" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Left Emblem Container (104x104 at x=28, y=28) -->
  <g transform="translate(28,28)">
    <rect width="104" height="104" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4" />
    <rect width="104" height="104" rx="24" fill="none" stroke="url(#goldStrokeLight)" stroke-opacity="0.25" stroke-width="1.2" />

    <!-- Outer Cryptographic Shield Geometry -->
    <path d="M 52 14 
             L 79 24 
             C 79 47 74 71 52 86 
             C 30 71 25 47 25 24 
             Z" 
          fill="url(#shieldFillLight)" 
          stroke="url(#goldGLight)" 
          stroke-width="2.6" 
          stroke-linejoin="round"
          filter="url(#softGlowLight)" />

    <!-- Left Facet Shade -->
    <path d="M 52 17 
             L 28 25.8 
             C 28 46.5 32.5 68 52 82.5 
             Z" 
          fill="#e2e8f0" 
          opacity="0.5" />

    <!-- Shackle Arc -->
    <path d="M 42 43 V 35 C 42 29.5 46.5 25 52 25 C 57.5 25 62 29.5 62 35 V 43" 
          fill="none" 
          stroke="url(#goldStrokeLight)" 
          stroke-width="3.6" 
          stroke-linecap="round" />

    <!-- Shield-Vault Core Body -->
    <rect x="35" y="42" width="34" height="27" rx="7" 
          fill="url(#goldGLight)" 
          stroke="#d97706" 
          stroke-width="1" />

    <!-- Confidential Shutter Slits (Zero-Knowledge Iris) -->
    <path d="M 40 48.5 H 64" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <path d="M 40 54 H 64" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <path d="M 40 59.5 H 64" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- Central Keyhole Nexus -->
    <circle cx="52" cy="54" r="3.6" fill="#0f172a" stroke="#ffffff" stroke-width="1.2" />
    <path d="M 50.6 54.5 L 49.8 62 H 54.2 L 53.4 54.5 Z" fill="#0f172a" />
    <circle cx="52" cy="54" r="1.3" fill="#fde047" />

    <!-- Orbit Nodes -->
    <circle cx="19" cy="46" r="2.2" fill="#059669" />
    <circle cx="85" cy="46" r="2.2" fill="#0284c7" />
  </g>

  <!-- Typography & Wordmark Section -->
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Main Brand Name -->
    <text x="156" y="81" font-size="44" font-weight="900" letter-spacing="1.5" fill="#0f172a">
      BLIND<tspan fill="url(#goldGLight)">SHARE</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="158" y="108" font-size="12" font-weight="700" letter-spacing="3.2" fill="#64748b">
      ZERO-KNOWLEDGE DOCUMENT VAULT
    </text>
  </g>

  <!-- High-Tech Verified E2EE Security Badge Pill -->
  <g transform="translate(480, 56)">
    <rect width="132" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#059669" />
    <circle cx="16" cy="15" r="7" fill="none" stroke="#059669" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="28" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#0284c7" letter-spacing="0.8">
      100% ZK E2EE
    </text>
  </g>
</svg>
