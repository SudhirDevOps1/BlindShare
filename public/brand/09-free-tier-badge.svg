<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
<title>₹0 Free-Tier Badge</title>
<rect width="600" height="360" rx="24" fill="#080e1a"/>
<defs>
  <linearGradient id="goldG9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  <filter id="glow9" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#f59e0b" flood-opacity="0.22"/></filter>
</defs>
<!-- Outer glow -->
<ellipse cx="300" cy="180" rx="220" ry="140" fill="url(#goldG9)" opacity="0.08"/>
<!-- Badge Card -->
<g transform="translate(80,40)">
  <rect width="440" height="280" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="1.6"/>
  <rect width="440" height="280" rx="20" fill="none" stroke="#f59e0b" stroke-opacity="0.10" stroke-width="12"/>
  <!-- Top pill -->
  <g transform="translate(150,18)">
    <rect width="140" height="22" rx="11" fill="url(#goldG9)" filter="url(#glow9)"/>
    <text x="70" y="15" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.6" fill="#080e1a">SELF-HOSTED • OPEN</text>
  </g>
  <!-- Rupee big -->
  <g transform="translate(220,104)" text-anchor="middle">
    <text font-family="Inter,sans-serif" font-size="86" font-weight="800" fill="#f59e0b" letter-spacing="-2">₹0</text>
    <text y="86" font-family="Inter,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#ffffff">FREE TO HOST</text>
    <text y="104" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="2.4" fill="#fbbf24">FREE-TIER HOSTING PRESETS</text>
    <rect x="-78" y="116" width="156" height="1.5" fill="#1e293b"/>
    <text y="132" font-family="Inter,sans-serif" font-size="7.5" font-weight="600" letter-spacing="1" fill="#94a3b8">no vendor lock-in • bring your own infra</text>
  </g>
  <!-- Bottom features -->
  <g transform="translate(22,244)">
    <g>
      <rect width="128" height="18" rx="9" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#10b981"/>
      <text x="18" y="13" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#6ee7b7">Docker • One Click</text>
    </g>
    <g transform="translate(144,0)">
      <rect width="128" height="18" rx="9" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#3b82f6"/>
      <text x="18" y="13" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#93c5fd">Vercel • Fly • Railway</text>
    </g>
    <g transform="translate(288,0)">
      <rect width="128" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#f59e0b"/>
      <text x="18" y="13" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" fill="#e2e8f0">MIT • Open Source</text>
    </g>
  </g>
  <!-- Sparkles -->
  <g fill="#f59e0b" opacity="0.9">
    <path d="M 40 72 L41.2 75.5 L44.7 76.7 L41.2 77.9 L40 81.4 L38.8 77.9 L35.3 76.7 L38.8 75.5 Z"/>
    <path d="M 400 62 L401 64.5 L403.5 65.5 L401 66.5 L400 69 L399 66.5 L396.5 65.5 L399 64.5 Z" opacity="0.7"/>
    <path d="M 380 200 L381 202 L383 203 L381 204 L380 206 L379 204 L377 203 L379 202 Z" opacity="0.6"/>
  </g>
</g>
</svg>