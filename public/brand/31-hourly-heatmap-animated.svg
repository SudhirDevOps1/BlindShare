<g transform="translate(24,290)"><rect width="912" height="46" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/><text x="16" y="18" font-family="Inter,sans-serif" font-size="7.5" font-weight="700" fill="#f59e0b">NEW: charts/hourly-heatmap.tsx</text><text x="16" y="32" font-family="monospace" font-size="6.5" fill="#64748b">7 rows (Mon-Sun) × 24 cols (12a-11p) • gold intensity • tooltip: 42 views Tue 10am</text><text x="896" y="20" text-anchor="end" font-family="Inter,sans-serif" font-size="7" font-weight="800" fill="#f59e0b">ADD, not replace</text></g>
