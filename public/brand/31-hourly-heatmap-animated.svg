        <rect x="0" y="13" width="11" height="11" rx="2" fill="#1e293b"/><rect x="36" y="13" width="11" height="11" rx="2" fill="#f59e0b" opacity="0.72"/><rect x="60" y="13" width="11" height="11" rx="2" fill="#f59e0b" opacity="0.92"><animate attributeName="opacity" values="0.92;0.52;0.92" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="0" y="26" width="11" height="11" rx="2" fill="#1e293b"/><rect x="48" y="26" width="11" height="11" rx="2" fill="#fbbf24" opacity="0.88"/>
        <rect x="0" y="39" width="11" height="11" rx="2" fill="#1e293b"/><rect x="60" y="39" width="11" height="11" rx="2" fill="#f59e0b" opacity="0.95"/>
        <rect x="0" y="52" width="11" height="11" rx="2" fill="#334155"/><rect x="36" y="52" width="11" height="11" rx="2" fill="#f59e0b" opacity="0.5"/>
        <rect x="0" y="65" width="11" height="11" rx="2" fill="#1e293b"/><rect x="24" y="65" width="11" height="11" rx="2" fill="#334155"/>
        <rect x="0" y="78" width="11" height="11" rx="2" fill="#1e293b"/><rect x="60" y="78" width="11" height="11" rx="2" fill="#334155"/>
      </g>
      <g font-family="Inter,sans-serif" font-size="6" fill="#475569" text-anchor="end"><text x="-8" y="8">Mon</text><text x="-8" y="21">Tue</text><text x="-8" y="34">Wed</text><text x="-8" y="47">Thu</text><text x="-8" y="60">Fri</text><text x="-8" y="73">Sat</text><text x="-8" y="86">Sun</text></g>
      <rect x="320" y="0" width="38" height="94" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/><text x="339" y="28" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="800" fill="#080e1a">10am</text><text x="339" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#080e1a">PEAK</text><text x="339" y="54" text-anchor="middle" font-family="monospace" font-size="6" fill="#080e1a">42 views</text><circle cx="339" cy="78" r="3" fill="#080e1a" opacity="0.35"><animate attributeName="opacity" values="0.35;0.85;0.35" dur="1s" repeatCount="indefinite"/></circle>
    </g>
    <text x="0" y="124" font-family="Inter,sans-serif" font-size="6.5" fill="#64748b">Data: <tspan font-family="monospace" fill="#94a3b8">sessions.startedAt → hourOfDay × dayOfWeek</tspan> • no new capture needed</text>
    <text x="0" y="136" font-family="Inter,sans-serif" font-size="6.5" fill="#475569">Insight: Tue 10am is golden hour for investors — schedule sends then.</text>
