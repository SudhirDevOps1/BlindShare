<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img">
<title>Hourly Heatmap 24×7 — Animated</title>
<rect width="960" height="360" rx="16" fill="#080e1a"/>
<text x="24" y="28" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#fff">HOURLY HEATMAP • 24×7</text>
<text x="24" y="44" font-family="Inter,sans-serif" font-size="7" fill="#64748b">Best time to send deck — hour × day • P0 #2</text>
<text x="936" y="28" text-anchor="end" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#f59e0b">● GOLD INTENSITY</text>
<g transform="translate(24,56)">
  <rect width="912" height="220" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(56,16)">
    <g font-family="Inter,sans-serif" font-size="6" fill="#475569" text-anchor="middle">
      <text x="0" y="0">12a</text><text x="70" y="0">6a</text><text x="140" y="0">12p</text><text x="210" y="0">6p</text><text x="280" y="0">12a</text>
    </g>
    <g transform="translate(0,8)">
      <!-- 7 rows x 24 cols mock -->
      <g opacity="0.95">
        <rect x="0" y="0" width="11" height="11" rx="2" fill="#1e293b"/><rect x="12" y="0" width="11" height="11" rx="2" fill="#1e293b"/><rect x="24" y="0" width="11" height="11" rx="2" fill="#334155"/><rect x="36" y="0" width="11" height="11" rx="2" fill="#f59e0b" opacity="0.45"><animate attributeName="opacity" values="0.45;0.85;0.45" dur="1.6s" repeatCount="indefinite"/></rect>
