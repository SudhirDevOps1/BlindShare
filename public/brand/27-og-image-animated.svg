<g transform="translate(72,560)" text-anchor="middle"><rect x="0" y="0" width="528" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/><text x="264" y="16" font-family="monospace" font-size="7" fill="#475569">og-image.png • 1200×630 • X/Twitter • LinkedIn • WhatsApp</text></g>
