<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BlindShare App Icon 512">
  <defs>
    <linearGradient id="goldG512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldGStroke512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="shieldFill512" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="bgG512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <filter id="goldGlow512" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Backdrop -->
  <rect width="512" height="512" rx="120" fill="url(#bgG512)" stroke="#1e293b" stroke-width="7" />
  <rect width="512" height="512" rx="120" fill="none" stroke="url(#goldGStroke512)" stroke-opacity="0.25" stroke-width="6" />

  <!-- Outer Cryptographic Shield Geometry -->
  <path d="M 256 72 
           L 394 123 
           C 394 241 369 364 256 440 
           C 143 364 118 241 118 123 
           Z" 
        fill="url(#shieldFill512)" 
        stroke="url(#goldG512)" 
        stroke-width="13" 
        stroke-linejoin="round"
        filter="url(#goldGlow512)" />

  <!-- Inner Geometric Bevel Facets -->
  <path d="M 256 87 
           L 133 132 
           C 133 238 156 348 256 422 
           Z" 
        fill="#070d1a" 
        opacity="0.75" />

  <path d="M 256 87 
           L 379 132 
           C 379 238 356 348 256 422 
           Z" 
        fill="url(#goldG512)" 
        opacity="0.06" />

  <!-- Shackle Arc -->
  <path d="M 205 220 V 179 C 205 151 228 128 256 128 C 284 128 307 151 307 179 V 220" 
        fill="none" 
        stroke="url(#goldGStroke512)" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- Shield-Vault Core Body -->
  <rect x="169" y="215" width="174" height="138" rx="36" 
        fill="url(#goldG512)" 
        stroke="#fef08a" 
        stroke-width="5" />

  <!-- Shutter Slits -->
  <path d="M 194 248 H 318" stroke="#090d16" stroke-width="9" stroke-linecap="round" opacity="0.85" />
  <path d="M 194 276 H 318" stroke="#090d16" stroke-width="9" stroke-linecap="round" opacity="0.85" />
  <path d="M 194 304 H 318" stroke="#090d16" stroke-width="9" stroke-linecap="round" opacity="0.85" />

  <!-- Central Keyhole Nexus -->
  <circle cx="256" cy="276" r="18" fill="#070b14" stroke="url(#goldG512)" stroke-width="6" />
  <path d="M 249 278 L 245 317 H 267 L 263 278 Z" fill="#070b14" />
  <circle cx="256" cy="276" r="6.5" fill="#fde047" />

  <!-- Courier Nodes -->
  <circle cx="90" cy="235" r="11" fill="#10b981" />
  <circle cx="90" cy="235" r="23" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="5" />

  <circle cx="422" cy="235" r="11" fill="#38bdf8" />
  <circle cx="422" cy="235" r="23" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="5" />
</svg>
