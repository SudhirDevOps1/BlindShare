<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<title>Hero — Zero-Knowledge Encryption Flow</title>
<rect width="1200" height="560" rx="24" fill="#080e1a"/>
<defs>
  <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.18"/></filter>
</defs>
<ellipse cx="600" cy="280" rx="560" ry="180" fill="#f59e0b" opacity="0.03"/>
<!-- Grid -->
<g opacity="0.06" stroke="#1e293b" stroke-width="1">
  <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200"/>
  <path d="M200 0 V560 M400 0 V560 M600 0 V560 M800 0 V560 M1000 0 V560"/>
</g>
<!-- Title -->
<text x="600" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#94a3b8">ZERO-KNOWLEDGE ENCRYPTION FLOW</text>
<text x="600" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#475569">DOCUMENT → AES-GCM-256 → CIPHERTEXT CLOUD → RECIPIENT DECRYPT</text>

<!-- Step 1: Document -->
<g transform="translate(90,130)">
  <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="18" y="20" width="144" height="10" rx="5" fill="#1e293b"/>
  <rect x="18" y="38" width="100" height="7" rx="3.5" fill="#1e293b"/>
  <rect x="18" y="58" width="144" height="7" rx="3.5" fill="#334155"/>
  <rect x="18" y="72" width="144" height="7" rx="3.5" fill="#334155"/>
  <rect x="18" y="86" width="120" height="7" rx="3.5" fill="#1e293b"/>
  <!-- Doc icon -->
  <g transform="translate(64,112)">
    <rect x="0" y="0" width="52" height="64" rx="8" fill="#ffffff" opacity="0.96"/>
    <path d="M38 0 L52 14 V64 H0 V0 Z" fill="#f1f5f9"/>
    <path d="M38 0 V14 H52" fill="#e2e8f0"/>
    <rect x="10" y="24" width="32" height="4" rx="2" fill="#f59e0b"/>
    <rect x="10" y="32" width="28" height="3" rx="1.5" fill="#64748b"/>
    <rect x="10" y="38" width="32" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="10" y="44" width="24" height="3" rx="1.5" fill="#cbd5e1"/>
  </g>
  <text x="90" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#e2e8f0">PLAINTEXT</text>
  <text x="90" y="224" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="500" letter-spacing="1" fill="#94a3b8">in browser RAM only</text>
  <g transform="translate(82,248)">
    <rect width="16" height="16" rx="8" fill="#10b981" opacity="0.15"/>
    <circle cx="8" cy="8" r="3.5" fill="#10b981"/>
  </g>
</g>

<!-- Arrow 1 -->
<g transform="translate(270,250)">
  <rect x="0" y="-1" width="98" height="2" fill="#f59e0b"/>
  <path d="M 98 -7 L 112 0 L 98 7 Z" fill="#f59e0b"/>
  <!-- Flow particles -->
  <circle cx="24" cy="0" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="48" cy="0" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="72" cy="0" r="2.5" fill="#fbbf24" opacity="0.8"/>
</g>
<text x="319" y="238" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" letter-spacing="1.2" fill="#f59e0b">ENCRYPT</text>

<!-- Step 2: AES Lock -->
<g transform="translate(388,130)">
  <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1.2"/>
  <!-- Glow -->
  <rect width="180" height="240" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="12"/>
  <g transform="translate(90,108)">
    <!-- Lock body -->
    <rect x="-34" y="-10" width="68" height="52" rx="10" fill="#f59e0b" />
    <rect x="-34" y="-10" width="68" height="52" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <!-- Shackle -->
    <path d="M -18 -10 V -26 A 18 18 0 0 1 18 -26 V -10" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <path d="M -18 -10 V -26 A 18 18 0 0 1 18 -26 V -10" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <!-- Keyhole -->
    <circle cx="0" cy="14" r="9" fill="#080e1a" opacity="0.92"/>
    <rect x="-3.2" y="14" width="6.4" height="14" rx="3.2" fill="#080e1a"/>
    <circle cx="0" cy="10.5" r="3.2" fill="#f59e0b" opacity="0.95"/>
    <!-- Tiny pulse -->
    <circle cx="0" cy="43" r="3" fill="#10b981"/>
    <circle cx="0" cy="43" r="7" fill="none" stroke="#10b981" stroke-opacity="0.32" stroke-width="1.2"/>
  </g>
  <text x="90" y="190" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#f59e0b">AES-GCM-256</text>
  <text x="90" y="204" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.2" fill="#fbbf24">WebCrypto • RAM ONLY</text>
  <g transform="translate(32,220)">
    <rect width="116" height="22" rx="11" fill="#10b981" opacity="0.12" />
    <circle cx="14" cy="11" r="4" fill="#10b981"/>
    <circle cx="14" cy="11" r="7" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="1"/>
    <text x="25" y="14.5" font-family="Inter,sans-serif" font-size="7.5" font-weight="800" letter-spacing="1" fill="#10b981">ENCRYPTED</text>
  </g>
</g>

<!-- Arrow 2 -->
<g transform="translate(568,250)">
  <rect x="0" y="-1" width="96" height="2" fill="#475569"/>
  <path d="M 96 -7 L 110 0 L 96 7 Z" fill="#475569"/>
  <g opacity="0.9">
    <rect x="24" y="-6" width="7" height="7" rx="1.2" fill="#1e293b" stroke="#64748b" stroke-width="0.8" transform="rotate(28 27.5 -2.5)"/>
    <rect x="44" y="-5" width="7" height="7" rx="1.2" fill="#1e293b" stroke="#64748b" stroke-width="0.8" transform="rotate(28 47.5 -1.5)"/>
    <rect x="66" y="-6" width="7" height="7" rx="1.2" fill="#1e293b" stroke="#64748b" stroke-width="0.8" transform="rotate(28 69.5 -2.5)"/>
    <text x="54" y="-12" text-anchor="middle" font-family="monospace" font-size="6" fill="#475569" letter-spacing="1">101010</text>
  </g>
</g>
<text x="618" y="238" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" letter-spacing="1" fill="#64748b">CIPHERTEXT ONLY</text>

<!-- Step 3: Cloud Ciphertext -->
<g transform="translate(684,130)">
  <rect width="220" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <!-- Cloud -->
  <g transform="translate(110,108)">
    <ellipse cx="0" cy="14" rx="72" ry="28" fill="#1e293b" opacity="0.95"/>
    <ellipse cx="-28" cy="4" rx="34" ry="30" fill="#1e293b"/>
    <ellipse cx="18" cy="-8" rx="42" ry="34" fill="#1e293b"/>
    <ellipse cx="38" cy="8" rx="28" ry="22" fill="#1e293b"/>
    <ellipse cx="-10" cy="-16" rx="22" ry="18" fill="#1e293b"/>
    <!-- Blindfold -->
    <rect x="-36" y="-6" width="72" height="10" rx="5" fill="#080e1a" stroke="#334155" stroke-width="1"/>
    <rect x="-32" y="-3" width="64" height="4" rx="2" fill="#475569"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Inter,sans-serif" font-size="16">🙈</text>
    <!-- Encrypted bytes -->
    <g font-family="monospace" font-size="6.5" fill="#64748b" opacity="0.9" text-anchor="middle">
      <text x="0" y="38">a7 f3 9c 1e • 4d 8b</text>
      <text x="0" y="46">ciphertext • random bytes</text>
    </g>
  </g>
  <text x="110" y="184" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#e2e8f0">BLIND COURIER</text>
  <text x="110" y="198" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" font-weight="500" letter-spacing="1" fill="#94a3b8">server stores only ciphertext</text>
  <g transform="translate(28,212)">
    <rect width="164" height="26" rx="13" fill="#ef4444" fill-opacity="0.09" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="16" cy="13" r="5" fill="none" stroke="#ef4444" stroke-width="1.2"/>
    <path d="M13 13 L19 13 M16 10 L16 16" stroke="#ef4444" stroke-width="1.1" stroke-linecap="round"/>
    <text x="27" y="16.5" font-family="Inter,sans-serif" font-size="7.2" font-weight="700" letter-spacing="0.8" fill="#fca5a5">CANNOT DECODE • MATHEMATICALLY BLIND</text>
  </g>
</g>

<!-- Arrow 3 -->
<g transform="translate(904,250)">
  <rect x="0" y="-1" width="96" height="2" fill="#10b981"/>
  <path d="M 96 -7 L 110 0 L 96 7 Z" fill="#10b981"/>
  <circle cx="30" cy="0" r="2.5" fill="#10b981"/>
  <circle cx="55" cy="0" r="2" fill="#10b981" opacity="0.6"/>
  <circle cx="78" cy="0" r="2.5" fill="#34d399"/>
</g>
<text x="954" y="238" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" letter-spacing="1.2" fill="#10b981">DECRYPT</text>

<!-- Step 4: Recipient -->
<g transform="translate(1020,130)">
  <rect width="90" height="240" rx="16" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
  <g transform="translate(45,108)">
    <!-- Person -->
    <circle cx="0" cy="-6" r="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="0" cy="-6" r="18" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="6"/>
    <path d="M -6 -8 Q 0 -12 6 -8" fill="none" stroke="#e2e8f0" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="-5" cy="-3" r="1.3" fill="#e2e8f0"/>
    <circle cx="5" cy="-3" r="1.3" fill="#e2e8f0"/>
    <path d="M -3 3 Q 0 6 3 3" fill="none" stroke="#10b981" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Body doc -->
    <rect x="-14" y="18" width="28" height="34" rx="6" fill="#ffffff"/>
    <rect x="-9" y="24" width="18" height="3" rx="1.5" fill="#10b981"/>
    <rect x="-9" y="30" width="14" height="2" rx="1" fill="#94a3b8"/>
    <rect x="-9" y="34" width="18" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="-9" y="38" width="12" height="2" rx="1" fill="#cbd5e1"/>
    <circle cx="0" cy="16" r="2.5" fill="#10b981"/>
  </g>
  <text x="45" y="188" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#10b981">UNLOCKED</text>
  <text x="45" y="200" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" letter-spacing="0.8" fill="#6ee7b7">in recipient browser</text>
  <g transform="translate(22,216)">
    <rect width="46" height="16" rx="8" fill="#10b981"/>
    <text x="23" y="11" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="800" letter-spacing="0.6" fill="#080e1a">VERIFIED</text>
  </g>
</g>

<!-- Footer proof -->
<g transform="translate(600,430)" text-anchor="middle">
  <rect x="-260" y="0" width="520" height="44" rx="22" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text y="18" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="1.8" fill="#94a3b8">END-TO-END PROOF • SERVER SEES <tspan fill="#ef4444" font-weight="800">0 BYTES</tspan> PLAINTEXT</text>
  <text y="32" font-family="monospace" font-size="7" fill="#475569" letter-spacing="1">client-side WebCrypto AES-GCM-256 • keys never leave device • self-hosted vault</text>
  <g transform="translate(-220,22)">
    <circle r="3" fill="#10b981"/>
    <circle r="6" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  </g>
  <g transform="translate(220,22)">
    <circle r="3" fill="#f59e0b"/>
    <circle r="6" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</g>
</svg>