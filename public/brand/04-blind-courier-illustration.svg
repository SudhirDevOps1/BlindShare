<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img">
<title>Server Never Sees Files — Blind Courier</title>
<rect width="720" height="520" rx="24" fill="#080e1a"/>
<defs>
  <linearGradient id="goldG2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  <filter id="shadowPkg" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<ellipse cx="360" cy="260" rx="320" ry="160" fill="#f59e0b" opacity="0.03"/>
<text x="360" y="46" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#ffffff">THE SERVER <tspan fill="#f59e0b">NEVER</tspan> SEES YOUR FILES</text>
<text x="360" y="66" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="500" letter-spacing="2.4" fill="#64748b">NOT ONCE • NOT EVER • MATHEMATICALLY BLIND</text>

<!-- Server Rack -->
<g transform="translate(200,110)">
  <rect width="320" height="320" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.4"/>
  <!-- rack header -->
  <rect x="0" y="0" width="320" height="44" rx="20" fill="#1e293b"/>
  <rect x="0" y="22" width="320" height="22" fill="#1e293b"/>
  <circle cx="20" cy="22" r="3" fill="#ef4444"/>
  <circle cx="32" cy="22" r="3" fill="#f59e0b"/>
  <circle cx="44" cy="22" r="3" fill="#10b981"/>
  <text x="160" y="26" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" letter-spacing="2" fill="#94a3b8">BLINDSHARE NODE • 10.0.1.4</text>
  <text x="286" y="26" font-family="Inter,sans-serif" font-size="6" font-weight="700" fill="#475569">SELF-HOSTED</text>

  <!-- Server units -->
  <g transform="translate(24,64)">
    <rect width="272" height="46" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <rect x="12" y="14" width="40" height="4" rx="2" fill="#1e293b"/>
    <rect x="12" y="22" width="28" height="3" rx="1.5" fill="#0f172a"/>
    <g transform="translate(232,18)">
      <circle r="4" fill="none" stroke="#334155" stroke-width="1"/>
      <circle r="1.8" fill="#334155"/>
    </g>
    <g transform="translate(212,18)">
      <circle r="4" fill="none" stroke="#334155" stroke-width="1"/>
      <circle r="1.8" fill="#334155"/>
    </g>
    <text x="66" y="30" font-family="monospace" font-size="7" fill="#475569">ciphertext block #a7f3 …</text>
  </g>
  <g transform="translate(24,120)">
    <rect width="272" height="46" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <rect x="12" y="14" width="40" height="4" rx="2" fill="#1e293b"/>
    <rect x="12" y="22" width="28" height="3" rx="1.5" fill="#0f172a"/>
    <text x="66" y="30" font-family="monospace" font-size="7" fill="#475569">ciphertext block #4d8b …</text>
    <g transform="translate(232,18)"><circle r="4" fill="none" stroke="#334155" stroke-width="1"/><circle r="1.8" fill="#334155"/></g>
  </g>
  <g transform="translate(24,176)">
    <rect width="272" height="46" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="136" y="28" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" letter-spacing="1.4" fill="#334155">RANDOM BYTES ONLY • NO KEYS</text>
  </g>

  <!-- Blindfold over server -->
  <g transform="translate(160,96)">
    <!-- Eyes blindfold -->
    <rect x="-78" y="-10" width="156" height="22" rx="11" fill="#080e1a" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="-70" y="-5" width="140" height="12" rx="6" fill="#f59e0b" opacity="0.95"/>
    <!-- X eyes -->
    <g stroke="#080e1a" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
      <path d="M -36 -2 L -28 6 M -28 -2 L -36 6"/>
      <path d="M 28 -2 L 36 6 M 36 -2 L 28 6"/>
    </g>
    <text x="0" y="4" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" font-weight="800" letter-spacing="1.2" fill="#080e1a">BLIND</text>
  </g>

  <!-- Arms carrying encrypted package -->
  <!-- Left arm -->
  <path d="M 24 264 C 44 284 84 296 116 288" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
  <path d="M 24 264 C 44 284 84 296 116 288" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M 296 264 C 276 284 236 296 204 288" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
  <path d="M 296 264 C 276 284 236 296 204 288" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Encrypted package -->
  <g transform="translate(160,238)" filter="url(#shadowPkg)">
    <rect x="-62" y="-34" width="124" height="78" rx="12" fill="url(#goldG2)" stroke="#fbbf24" stroke-width="1.4"/>
    <rect x="-62" y="-34" width="124" height="18" rx="12" fill="#fbbf24" opacity="0.95"/>
    <rect x="-62" y="-22" width="124" height="6" fill="#fbbf24"/>
    <!-- Tape -->
    <rect x="-8" y="-34" width="16" height="78" fill="#080e1a" opacity="0.10"/>
    <rect x="-1.2" y="-34" width="2.4" height="78" fill="#080e1a" opacity="0.18"/>
    <!-- Lock -->
    <g transform="translate(0,12)">
      <rect x="-14" y="-6" width="28" height="20" rx="5" fill="#080e1a"/>
      <path d="M -8 -6 V -12 A 8 8 0 0 1 8 -12 V -6" fill="none" stroke="#080e1a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="3" fill="#f59e0b"/>
      <rect x="-1.2" y="4" width="2.4" height="6" rx="1.2" fill="#f59e0b"/>
    </g>
    <text x="0" y="-14" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="800" letter-spacing="1" fill="#080e1a">ENCRYPTED</text>
    <!-- Shine -->
    <path d="M -56 -28 Q -40 -30 -32 -24" fill="none" stroke="white" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- X ray attempt blocked -->
  <g transform="translate(160,312)">
    <circle r="14" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.85"/>
    <path d="M -7 -7 L 7 7 M 7 -7 L -7 7" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text x="160" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.2" fill="#ef4444">CAN’T PEEK • CAN’T DECODE</text>
</g>

<!-- Floating ciphertext particles -->
<g opacity="0.55" font-family="monospace" font-size="7" fill="#334155">
  <text x="56" y="190">a7 f3</text>
  <text x="68" y="410">9c 1e</text>
  <text x="612" y="180">4d 8b</text>
  <text x="624" y="420">e2 71</text>
</g>
<!-- Side badges -->
<g transform="translate(36,210)">
  <rect width="132" height="64" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="16" cy="18" r="6" fill="#ef4444" opacity="0.15"/>
  <path d="M11 18 L21 18 M16 13 L16 23" stroke="#ef4444" stroke-width="1.3" stroke-linecap="round"/>
  <text x="30" y="16" font-family="Inter,sans-serif" font-size="7" font-weight="800" fill="#fca5a5">SERVER EYES</text>
  <text x="30" y="26" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#475569">sees 0% plaintext</text>
  <rect x="12" y="36" width="108" height="6" rx="3" fill="#1e293b"/>
  <rect x="12" y="36" width="4" height="6" rx="3" fill="#ef4444"/>
  <text x="12" y="52" font-family="Inter,sans-serif" font-size="6" font-weight="700" letter-spacing="0.8" fill="#ef4444">0 BYTES DECODED</text>
</g>
<g transform="translate(550,210)">
  <rect width="132" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="16" cy="18" r="6" fill="#10b981" opacity="0.15"/>
  <path d="M12 18 L15 21 L20 14" fill="none" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="16" font-family="Inter,sans-serif" font-size="7" font-weight="800" fill="#6ee7b7">CLIENT VAULT</text>
  <text x="30" y="26" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#94a3b8">keys never leave device</text>
  <rect x="12" y="36" width="108" height="6" rx="3" fill="#1e293b"/>
  <rect x="12" y="36" width="108" height="6" rx="3" fill="#10b981"/>
  <text x="12" y="52" font-family="Inter,sans-serif" font-size="6" font-weight="700" letter-spacing="0.8" fill="#10b981">100% END-TO-END</text>
</g>

<!-- Quote -->
<g transform="translate(360,474)">
  <rect x="-200" y="0" width="400" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text y="19" text-anchor="middle" font-family="Inter,sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#cbd5e1">“ Acts as a <tspan fill="#f59e0b" font-weight="800">blind courier</tspan> — carrying locked boxes it can never open ”</text>
</g>
</svg>