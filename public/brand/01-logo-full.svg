<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="BlindShare Full Brand Logo">
  <title>BlindShare — Zero-Knowledge Document Sharing</title>
  <defs>
    <!-- Radiant Cyber Gold Gradients -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldGStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Wordmark Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.32" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Deep Obsidian Container Canvas -->
  <rect width="640" height="160" rx="20" fill="#060911" />
  <rect width="640" height="160" rx="20" fill="none" stroke="#1e293b" stroke-opacity="0.7" stroke-width="1.2" />

  <!-- Ambient Backdrop Glow behind Logo Mark -->
  <ellipse cx="80" cy="80" rx="90" ry="70" fill="#f59e0b" opacity="0.04" />
  <ellipse cx="500" cy="80" rx="140" ry="60" fill="#38bdf8" opacity="0.02" />

  <!-- Left Emblem Container (104x104 at x=28, y=28) -->
  <g transform="translate(28,28)" filter="url(#cardShadow)">
    <rect width="104" height="104" rx="24" fill="url(#bgG)" stroke="#1e293b" stroke-width="1.4" />
    <rect width="104" height="104" rx="24" fill="none" stroke="url(#goldGStroke)" stroke-opacity="0.25" stroke-width="1.2" />

    <!-- Outer Cryptographic Shield Geometry -->
    <path d="M 52 14 
             L 79 24 
             C 79 47 74 71 52 86 
             C 30 71 25 47 25 24 
             Z" 
          fill="url(#shieldFill)" 
          stroke="url(#goldG)" 
          stroke-width="2.6" 
          stroke-linejoin="round"
          filter="url(#softGlow)" />

    <!-- Left Facet Shade -->
    <path d="M 52 17 
             L 28 25.8 
             C 28 46.5 32.5 68 52 82.5 
             Z" 
          fill="#070d1a" 
          opacity="0.75" />

    <!-- Right Facet Subtle Luster -->
    <path d="M 52 17 
             L 76 25.8 
             C 76 46.5 71.5 68 52 82.5 
             Z" 
          fill="url(#goldG)" 
          opacity="0.06" />

    <!-- Shackle Arc -->
    <path d="M 42 43 V 35 C 42 29.5 46.5 25 52 25 C 57.5 25 62 29.5 62 35 V 43" 
          fill="none" 
          stroke="url(#goldGStroke)" 
          stroke-width="3.6" 
          stroke-linecap="round" />

    <!-- Shield-Vault Core Body -->
    <rect x="35" y="42" width="34" height="27" rx="7" 
          fill="url(#goldG)" 
          stroke="#fef08a" 
          stroke-width="1" />

    <!-- Confidential Shutter Slits (Zero-Knowledge Iris) -->
    <path d="M 40 48.5 H 64" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <path d="M 40 54 H 64" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <path d="M 40 59.5 H 64" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <!-- Central Keyhole Nexus -->
    <circle cx="52" cy="54" r="3.6" fill="#070b14" stroke="url(#goldG)" stroke-width="1.2" />
    <path d="M 50.6 54.5 L 49.8 62 H 54.2 L 53.4 54.5 Z" fill="#070b14" />
    <circle cx="52" cy="54" r="1.3" fill="#fde047" />

    <!-- Orbit Nodes -->
    <circle cx="19" cy="46" r="2.2" fill="#10b981" />
    <circle cx="85" cy="46" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Typography & Wordmark Section -->
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Main Brand Name -->
    <text x="156" y="81" font-size="44" font-weight="900" letter-spacing="1.5" fill="#ffffff">
      BLIND<tspan fill="url(#goldG)">SHARE</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="158" y="108" font-size="12" font-weight="700" letter-spacing="3.2" fill="#94a3b8">
      ZERO-KNOWLEDGE DOCUMENT VAULT
    </text>
  </g>

  <!-- High-Tech Verified E2EE Security Badge Pill -->
  <g transform="translate(480, 56)">
    <rect width="132" height="30" rx="15" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <circle cx="16" cy="15" r="7" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
    <text x="28" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="0.8">
      100% ZK E2EE
    </text>
  </g>
</svg>
