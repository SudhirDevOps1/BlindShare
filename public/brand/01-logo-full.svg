<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img">
<title>BlindShare — Full Logo (Shield + Closed Eye) — Premium</title>
<desc>Enterprise zero-knowledge mark: shield + blind eye + share nodes, BLINDSHARE wordmark — improved premium edition bina kuchh hataye</desc>
<defs>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fde68a"/>
    <stop offset="50%" stop-color="#f59e0b"/>
    <stop offset="100%" stop-color="#d97706"/>
  </linearGradient>
  <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fde68a"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0b1329" />
    <stop offset="100%" stop-color="#030712" />
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.25"/>
  </filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
<rect width="640" height="160" rx="16" fill="#080e1a"/>
<!-- Subtle vignette -->
<ellipse cx="320" cy="80" rx="340" ry="90" fill="#f59e0b" opacity="0.025"/>
<!-- Icon Container 104x104 with Gold Document Padlock Shield (Unified with 02-favicon.svg) -->
<g transform="translate(28,28)" filter="url(#cardShadow)">
  <!-- Background rounded card -->
  <rect width="104" height="104" rx="23" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="104" height="104" rx="23" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Document Outline with Folded Bottom-Right Corner -->
  <path d="M 25 23 C 25 18 28 15 33 15 H 71 C 76 15 79 18 79 23 V 64 L 64 79 H 33 C 28 79 25 76 25 71 Z" 
        fill="#0c162d" 
        stroke="url(#goldGrad)" 
        stroke-width="4.2" 
        stroke-linejoin="round" />

  <!-- Folded Dog-Ear Flap -->
  <path d="M 64 64 H 79 L 64 79 Z" 
        fill="#1e293b" 
        stroke="url(#goldGrad)" 
        stroke-width="4.2" 
        stroke-linejoin="round" />

  <!-- Horizontal Document Line -->
  <line x1="35" y1="70" x2="56" y2="70" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" />

  <!-- Golden Padlock Shackle -->
  <path d="M 43 39 V 27 C 43 22 47 18 52 18 C 57 18 61 22 61 27 V 39" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5.7" 
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="34" y="38" width="36" height="28" rx="6.5" 
        fill="url(#goldGrad)" 
        stroke="#fef3c7" 
        stroke-width="1" 
        filter="url(#softGlow)" />

  <!-- Shield Shape inside Padlock Body -->
  <path d="M 52 44.5 L 60.5 47.5 V 53 C 60.5 57.5 56.8 60.8 52 62.3 C 47.2 60.8 43.5 57.5 43.5 53 V 47.5 Z" 
        fill="#080e1a" 
        stroke="#fde68a" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Keyhole inside Shield -->
  <circle cx="52" cy="52" r="2.3" fill="url(#goldGrad)" />
  <polygon points="50.8,52 53.2,52 54.1,57.8 49.9,57.8" fill="url(#goldGrad)" />
</g>
<!-- Wordmark — kept + improved kerning & weight -->
<g font-family="Inter, SF Pro Display, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="158" y="78" font-size="42" font-weight="800" letter-spacing="3.4" fill="#ffffff">BLIND<tspan fill="url(#goldGrad)">SHARE</tspan></text>
  <text x="160.5" y="102" font-size="11.5" font-weight="600" letter-spacing="4.4" fill="#64748b">ZERO-KNOWLEDGE • SELF-HOSTED • E2EE</text>
  <g transform="translate(160,112)">
    <rect width="286" height="1" fill="#1e293b"/>
    <rect width="86" height="1" fill="url(#goldGrad)" opacity="0.9"/>
    <text y="16" font-size="9" font-weight="500" letter-spacing="2.2" fill="#94a3b8">THE SERVER NEVER SEES YOUR FILES — EVER.</text>
  </g>
</g>
<!-- E2EE badge — kept + enhanced double pulse -->
<g transform="translate(560,22)">
  <rect width="54" height="20" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect width="54" height="20" rx="10" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="10" cy="10" r="4.2" fill="#10b981"/>
  <circle cx="10" cy="10" r="7.2" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.2"/>
  <circle cx="10" cy="10" r="11" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="1"/>
  <text x="19.5" y="14" font-family="Inter, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.8" fill="#e2e8f0">E2EE</text>
</g>
<!-- New: tiny light variant hint - does not remove anything -->
<g transform="translate(560,134)" opacity="0.95">
  <rect width="54" height="14" rx="7" fill="none" stroke="#1e293b" stroke-width="0.9"/>
  <text x="27" y="10" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="700" letter-spacing="1" fill="#475569">DARK • LIGHT</text>
</g>
</svg>