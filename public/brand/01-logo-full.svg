<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img">
<title>BlindShare — Full Logo (Shield + Closed Eye) — Premium</title>
<desc>Enterprise zero-knowledge mark: shield + blind eye + share nodes, BLINDSHARE wordmark — improved premium edition bina kuchh hataye</desc>
<defs>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/>
  </linearGradient>
  <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
  </linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.14"/>
  </filter>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
<rect width="640" height="160" rx="16" fill="#080e1a"/>
<!-- Subtle vignette - kept, enhanced -->
<ellipse cx="320" cy="80" rx="340" ry="90" fill="#f59e0b" opacity="0.025"/>
<!-- Icon Container 104x104 -->
<g transform="translate(28,28)" filter="url(#cardShadow)">
  <rect width="104" height="104" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="104" height="104" rx="24" fill="none" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Shield outer premium stroke -->
  <path d="M 52 12 L 86 26 V 56 C 86 73.5 71.2 88.2 52 96 C 32.8 88.2 18 73.5 18 56 V 26 L 52 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.3" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M 52 16.5 L 82 29 V 56 C 82 71 68 84.5 52 91.5 C 36 84.5 22 71 22 56 V 29 L 52 16.5 Z" fill="none" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="1"/>
  <!-- Inner gold wash at bottom - new enhancement -->
  <path d="M 52 91.5 C 36 84.5 22 71 22 56 V 68 C 22 75 36 88.2 52 96 C 68 88.2 86 75 86 68 V 56 C 86 71 68 84.5 52 91.5 Z" fill="url(#goldGrad)" opacity="0.06"/>
  <!-- Closed Eye — enhanced with subtle shine -->
  <path d="M 28 48 Q 52 28 76 48" fill="none" stroke="#fbbf24" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 28 48 L 76 48" fill="none" stroke="url(#goldGrad)" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Eyelashes top (5) — kept + refined thickness -->
  <g stroke="url(#goldGrad)" stroke-width="1.65" stroke-linecap="round" opacity="0.98">
    <path d="M 35 36.5 L 33.5 30.5"/><path d="M 43.5 32 L 42.5 26"/><path d="M 52 30.2 L 52 24"/><path d="M 60.5 32 L 61.5 26"/><path d="M 69 36.5 L 70.5 30.5"/>
  </g>
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.88">
    <path d="M 40.5 48 L 39 53.5"/><path d="M 52 48 L 52 54.2"/><path d="M 63.5 48 L 65 53.5"/>
  </g>
  <!-- Share Nodes + Lock: kept identical concept, enhanced glow -->
  <g>
    <path d="M 52 64 L 36 73.5 L 52 82 L 68 73.5 Z" fill="none" stroke="#3b82f6" stroke-opacity="0.92" stroke-width="1.15" stroke-linejoin="round"/>
    <circle cx="52" cy="64" r="5.4" fill="url(#goldGrad)" stroke="#080e1a" stroke-width="1.2"/>
    <circle cx="36" cy="73.5" r="3.9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.35"/>
    <circle cx="68" cy="73.5" r="3.9" fill="#0f172a" stroke="#fbbf24" stroke-width="1.35"/>
    <circle cx="52" cy="82" r="3.9" fill="#0f172a" stroke="#3b82f6" stroke-width="1.35"/>
    <g transform="translate(52,64)">
      <rect x="-3.2" y="-1.2" width="6.4" height="5.2" rx="1.1" fill="#080e1a"/>
      <path d="M -2 -1.2 V -3.2 A 2 2 0 0 1 2 -3.2 V -1.2" fill="none" stroke="#080e1a" stroke-width="1.15" stroke-linecap="round"/>
      <circle cx="0" cy="1.4" r="0.95" fill="#fbbf24"/>
    </g>
  </g>
  <circle cx="14" cy="52" r="1.15" fill="#10b981" opacity="0.95"/>
  <circle cx="14" cy="52" r="3" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="90" cy="52" r="1.15" fill="#10b981" opacity="0.95"/>
  <circle cx="90" cy="52" r="3" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="1"/>
</g>
<!-- Wordmark — kept + improved kerning & weight -->
<g font-family="Inter, SF Pro Display, system-ui, -apple-system, Segoe UI, sans-serif">
  <text x="158" y="78" font-size="42" font-weight="800" letter-spacing="3.4" fill="#ffffff">BLIND<tspan fill="url(#goldGrad)">SHARE</tspan></text>
  <text x="160.5" y="102" font-size="11.5" font-weight="600" letter-spacing="4.4" fill="#64748b">ZERO-KNOWLEDGE • SELF-HOSTED • E2EE</text>
  <g transform="translate(160,112)">
    <rect width="286" height="1" fill="#1e293b"/>
    <rect width="86" height="1" fill="url(#goldGrad)" opacity="0.9"/>
    <text y="16" font-size="9" font-weight="500" letter-spacing="2.2" fill="#94a3b8">THE SERVER NEVER SEES YOUR FILES — EVER.</text>
  </g>
</g>
<!-- E2EE badge — kept + enhanced double pulse -->
<g transform="translate(560,22)">
  <rect width="54" height="20" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect width="54" height="20" rx="10" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="10" cy="10" r="4.2" fill="#10b981"/>
  <circle cx="10" cy="10" r="7.2" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.2"/>
  <circle cx="10" cy="10" r="11" fill="none" stroke="#10b981" stroke-opacity="0.10" stroke-width="1"/>
  <text x="19.5" y="14" font-family="Inter, sans-serif" font-size="7.5" font-weight="800" letter-spacing="0.8" fill="#e2e8f0">E2EE</text>
</g>
<!-- New: tiny light variant hint - does not remove anything -->
<g transform="translate(560,134)" opacity="0.95">
  <rect width="54" height="14" rx="7" fill="none" stroke="#1e293b" stroke-width="0.9"/>
  <text x="27" y="10" text-anchor="middle" font-family="Inter,sans-serif" font-size="5.2" font-weight="700" letter-spacing="1" fill="#475569">DARK • LIGHT</text>
</g>
</svg>