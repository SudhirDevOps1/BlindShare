<g transform="translate(24,290)"><rect width="912" height="46" rx="10" fill="#f59e0b"/><text x="456" y="18" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="800" fill="#080e1a">ADD as src/components/analytics/charts/views-timeline-area.tsx — no delete, just new file</text><text x="456" y="32" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#080e1a" opacity="0.7">daily views 30 pts • uses links[].viewCount same as weeklyData</text></g>
