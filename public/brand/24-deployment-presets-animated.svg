    @keyframes ultraPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(1.18)}}
    @keyframes ultraFlow{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
    @keyframes ultraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
<rect width="960" height="520" rx="24" fill="#080e1a"/>
<text x="480" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#fff">THREE <tspan fill="#f59e0b">₹0</tspan> PRESETS • ANIMATED</text>
<text x="480" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="500" letter-spacing="1.6" fill="#64748b">Vercel • Docker • Cloudflare • ALL FREE • NO CREDIT CARD</text>
<g opacity="0.95">
