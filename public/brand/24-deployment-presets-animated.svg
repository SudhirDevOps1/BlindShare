<g transform="translate(480,486)" text-anchor="middle"><text font-family="Inter,sans-serif" font-size="7" font-weight="600" letter-spacing="1.2" fill="#475569">ALL ₹0 • NO CREDIT CARD • MIX &amp; MATCH ADAPTERS • STORE_TARGET / DATABASE_DRIVER</text></g>
