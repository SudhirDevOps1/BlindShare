    @keyframes ultraPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(1.18)}}
    @keyframes ultraFlow{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
    @keyframes ultraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
</defs>
<rect width="960" height="520" rx="24" fill="#080e1a"/>
<text x="480" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#fff">UPLOAD <tspan fill="#f59e0b">→</tspan> GZIP <tspan fill="#f59e0b">→</tspan> ENCRYPT <tspan fill="#f59e0b">→</tspan> PRESIGNED S3</text>
<text x="480" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="500" letter-spacing="1.6" fill="#64748b">CLIENT-SIDE ONLY • 50–80% GZIP • DIRECT TO B2/R2 • BYPASSES VERCEL LIMITS</text>
<g opacity="0.95">
  <rect x="-220" y="82" width="220" height="3" rx="1.5" fill="#f59e0b" opacity="0.95" style="animation: ultraShimmer 1.8s linear infinite"/>
  <circle cx="10" cy="10" r="5" fill="#f59e0b" style="animation: ultraPulse 0.9s ease-in-out infinite"/>
</g>

<g transform="translate(48,96)">
