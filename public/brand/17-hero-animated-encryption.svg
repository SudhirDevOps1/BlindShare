<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<title>Showcase — Animated Hero Encryption Flow</title>
<defs>
  <linearGradient id="goldA" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  <filter id="glowA"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <style>
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @keyframes pulse{0%,100%{opacity:1;r:7}50%{opacity:.55;r:11}}
    @keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(88px);opacity:0}}
    @keyframes cloudFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  </style>

  <style>
    @keyframes ultraShimmer{0%{transform:translateX(-220px)}100%{transform:translateX(860px)}}
    @keyframes ultraPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(1.18)}}
    @keyframes ultraFlow{0%{stroke-dashoffset:700}100%{stroke-dashoffset:0}}
    @keyframes ultraFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="#080e1a"/>
<ellipse cx="600" cy="280" rx="560" ry="170" fill="#f59e0b" opacity="0.03"/>
<g opacity="0.06" stroke="#1e293b" stroke-width="1"><path d="M0 120 H1200 M0 240 H1200 M0 360 H1200"/><path d="M200 0 V560 M400 0 V560 M600 0 V560 M800 0 V560 M1000 0 V560"/></g>
<text x="600" y="46" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#fff">ZERO-KNOWLEDGE <tspan fill="#f59e0b">LIVE</tspan> FLOW</text>
<text x="600" y="68" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" letter-spacing="2.2" fill="#64748b">ANIMATED • PLAINTEXT → CIPHERTEXT → BLIND COURIER → DECRYPT</text>
<g opacity="0.95">
  <rect x="-220" y="82" width="220" height="3" rx="1.5" fill="#f59e0b" opacity="0.95" style="animation: ultraShimmer 1.8s linear infinite"/>
  <circle cx="10" cy="10" r="5" fill="#f59e0b" style="animation: ultraPulse 0.9s ease-in-out infinite"/>
</g>

<!-- Step 1 Document - subtle scan -->
<g transform="translate(90,130)">
  <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="18" y="20" width="144" height="10" rx="5" fill="#1e293b"/><rect x="18" y="38" width="100" height="7" rx="3.5" fill="#1e293b"/>
  <rect clip-path="url(#clipScan)"><g>
    <rect x="18" y="58" width="144" height="7" rx="3.5" fill="#334155"/><rect x="18" y="72" width="144" height="7" rx="3.5" fill="#334155"/><rect x="18" y="86" width="120" height="7" rx="3.5" fill="#1e293b"/>
  </g></rect>
  <defs><clipPath id="clipScan"><rect x="0" y="0" width="180" height="240" rx="16"/></clipPath></defs>
  <!-- scanning beam -->
  <rect x="0" y="0" width="180" height="2" fill="#f59e0b" opacity="0.9">
    <animate attributeName="y" values="58;150;58" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(64,112)">
    <rect x="0" y="0" width="52" height="64" rx="8" fill="#fff"/><path d="M38 0 L52 14 V64 H0 V0 Z" fill="#f1f5f9"/><path d="M38 0 V14 H52" fill="#e2e8f0"/>
    <rect x="10" y="24" width="32" height="4" rx="2" fill="#f59e0b"/><rect x="10" y="32" width="28" height="3" rx="1.5" fill="#64748b"/>
  </g>
  <text x="90" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#e2e8f0">PLAINTEXT</text>
  <text x="90" y="224" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="600" fill="#94a3b8">in browser RAM only</text>
  <g transform="translate(82,248)"><circle cx="8" cy="8" r="3.5" fill="#10b981"><animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/></circle><circle cx="8" cy="8" r="7" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="1"><animate attributeName="r" values="7;11;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.28;0;0.28" dur="1.2s" repeatCount="indefinite"/></circle></g>
</g>

<!-- Arrow 1 animated particles -->
<g transform="translate(270,250)">
  <rect x="0" y="-1" width="98" height="2" fill="url(#goldA)"/>
  <path d="M98 -7 L112 0 L98 7 Z" fill="#f59e0b"/>
  <g>
    <circle r="3" fill="#fbbf24"><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle r="2" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="1.4s" begin="0.35s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.35s" repeatCount="indefinite"/></circle>
    <circle r="2.5" fill="#fbbf24"><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- Step 2 AES Lock pulsing -->
<g transform="translate(388,130)">
  <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect width="180" height="240" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="12"/>
  <g transform="translate(90,108)">
    <rect x="-34" y="-10" width="68" height="52" rx="10" fill="url(#goldA)" filter="url(#glowA)"/>
    <path d="M -18 -10 V -26 A 18 18 0 0 1 18 -26 V -10" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="9" fill="#080e1a" opacity="0.92"/><rect x="-3.2" y="14" width="6.4" height="14" rx="3.2" fill="#080e1a"/><circle cx="0" cy="10.5" r="3.2" fill="#f59e0b"/>
    <circle cx="0" cy="43" r="3" fill="#10b981"/><circle cx="0" cy="43" r="7" fill="none" stroke="#10b981" stroke-width="1.2"><animate attributeName="r" values="7;13;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.32;0;0.32" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="90" y="190" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="800" fill="#f59e0b">AES-GCM-256</text>
  <text x="90" y="204" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" font-weight="600" fill="#fbbf24">WebCrypto • RAM ONLY</text>
  <g transform="translate(32,220)"><rect width="116" height="22" rx="11" fill="#10b981" opacity="0.12"/><circle cx="14" cy="11" r="4" fill="#10b981"/><text x="25" y="14.5" font-family="Inter,sans-serif" font-size="7.5" font-weight="800" fill="#10b981">ENCRYPTED</text><rect width="116" height="22" rx="11" fill="none" stroke="#10b981" stroke-opacity="0.12"><animate attributeName="stroke-opacity" values="0.12;0.28;0.12" dur="1.6s" repeatCount="indefinite"/></rect></g>
</g>

<!-- Arrow 2 ciphertext blocks sliding -->
<g transform="translate(568,250)">
  <rect x="0" y="-1" width="96" height="2" fill="#475569"/><path d="M96 -7 L110 0 L96 7 Z" fill="#475569"/>
  <g opacity="0.95">
    <g><rect x="0" y="-6" width="7" height="7" rx="1.2" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="2s" repeatCount="indefinite"/></g>
    <g><rect x="0" y="-6" width="7" height="7" rx="1.2" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/><animateTransform attributeName="transform" type="translate" values="-28 0; 60 0" dur="2s" repeatCount="indefinite"/></g>
  </g>
</g>

<!-- Step 3 Cloud floating -->
<g transform="translate(684,130)">
  <rect width="220" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
  <g transform="translate(110,108)" style="animation: cloudFloat 3s ease-in-out infinite">
    <ellipse cx="0" cy="14" rx="72" ry="28" fill="#1e293b"/><ellipse cx="-28" cy="4" rx="34" ry="30" fill="#1e293b"/><ellipse cx="18" cy="-8" rx="42" ry="34" fill="#1e293b"/>
    <rect x="-36" y="-6" width="72" height="10" rx="5" fill="#080e1a" stroke="#334155" stroke-width="1"/><rect x="-32" y="-3" width="64" height="4" rx="2" fill="#475569"/>
    <g font-family="monospace" font-size="6.5" fill="#64748b" text-anchor="middle"><text x="0" y="38">a7 f3 9c 1e • 4d 8b<animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/></text><text x="0" y="46">ciphertext • random bytes</text></g>
  </g>
  <text x="110" y="184" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#e2e8f0">BLIND COURIER</text>
  <g transform="translate(28,212)"><rect width="164" height="26" rx="13" fill="#ef4444" fill-opacity="0.09" stroke="#ef4444" stroke-opacity="0.2" stroke-width="1"/><text x="27" y="16.5" font-family="Inter,sans-serif" font-size="7.2" font-weight="700" fill="#fca5a5">CANNOT DECODE • MATHEMATICALLY BLIND</text><circle cx="16" cy="13" r="5" fill="none" stroke="#ef4444" stroke-width="1.2"><animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/></circle></g>
</g>

<!-- Arrow 3 decrypt green particles -->
<g transform="translate(904,250)">
  <rect x="0" y="-1" width="96" height="2" fill="#10b981"/><path d="M96 -7 L110 0 L96 7 Z" fill="#10b981"/>
  <circle r="2.5" fill="#10b981"><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle r="2" fill="#34d399"><animateTransform attributeName="transform" type="translate" values="0 0; 88 0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Step 4 Recipient unlock pulse -->
<g transform="translate(1020,130)">
  <rect width="90" height="240" rx="16" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
  <g transform="translate(45,108)">
    <circle r="18" fill="#1e293b" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/><circle r="18" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="6"><animate attributeName="stroke-opacity" values="0.18;0.42;0.18" dur="1.4s" repeatCount="indefinite"/></circle>
    <rect x="-14" y="18" width="28" height="34" rx="6" fill="#fff"/><rect x="-9" y="24" width="18" height="3" rx="1.5" fill="#10b981"/>
  </g>
  <text x="45" y="188" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="800" fill="#10b981">UNLOCKED</text>
  <g transform="translate(22,216)"><rect width="46" height="16" rx="8" fill="#10b981"/><text x="23" y="11" text-anchor="middle" font-family="Inter,sans-serif" font-size="6.5" font-weight="800" fill="#080e1a">VERIFIED</text><rect width="46" height="16" rx="8" fill="none" stroke="#10b981" stroke-opacity="0.0"><animate attributeName="stroke-opacity" values="0;0.35;0" dur="1.4s" repeatCount="indefinite"/></rect></g>
</g>

<g transform="translate(600,430)" text-anchor="middle"><rect x="-260" y="0" width="520" height="44" rx="22" fill="#0f172a" stroke="#1e293b" stroke-width="1"/><text y="18" font-family="Inter,sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#94a3b8">END-TO-END PROOF • SERVER SEES <tspan fill="#ef4444" font-weight="800">0 BYTES</tspan> PLAINTEXT</text><text y="32" font-family="monospace" font-size="7" fill="#475569">client-side WebCrypto AES-GCM-256 • keys never leave device</text></g>
</svg>