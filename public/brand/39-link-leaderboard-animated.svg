<g transform="translate(24,290)"><rect width="912" height="46" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/><text x="16" y="18" font-family="Inter,sans-serif" font-size="7.5" font-weight="700" fill="#f59e0b">P2 #11 • Uses links[].viewCount + avg dwell — no new capture</text><text x="16" y="32" font-family="monospace" font-size="6.5" fill="#64748b">Replaces recent links list with ranked — shows winner instantly</text></g>
