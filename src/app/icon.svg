<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="BlindShare Icon">
  <defs>
    <!-- Radiant Cyber Gold Gradients -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldGStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient High-Tech Drop Shadow & Glow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#f59e0b" flood-opacity="0.38" />
    </filter>
    <filter id="innerShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#fef08a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Backdrop -->
  <rect width="100" height="100" rx="24" fill="url(#bgG)" stroke="#1e293b" stroke-width="1.4" />
  <rect width="100" height="100" rx="24" fill="none" stroke="url(#goldGStroke)" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Outer Cryptographic Shield Geometry -->
  <path d="M 50 14 
           L 77 24 
           C 77 47 72 71 50 86 
           C 28 71 23 47 23 24 
           Z" 
        fill="url(#shieldFill)" 
        stroke="url(#goldG)" 
        stroke-width="2.6" 
        stroke-linejoin="round"
        filter="url(#goldGlow)" />

  <!-- Inner Geometric Bevel Facets -->
  <!-- Left Facet Shade -->
  <path d="M 50 17 
           L 26 25.8 
           C 26 46.5 30.5 68 50 82.5 
           Z" 
        fill="#070d1a" 
        opacity="0.75" />

  <!-- Right Facet Subtle Luster -->
  <path d="M 50 17 
           L 74 25.8 
           C 74 46.5 69.5 68 50 82.5 
           Z" 
        fill="url(#goldG)" 
        opacity="0.06" />

  <!-- Central Zero-Knowledge Aperture Shutter / Vault Key Nexus -->
  <!-- Shackle Arc (Continuous Modern Arch) -->
  <path d="M 40 43 V 35 C 40 29.5 44.5 25 50 25 C 55.5 25 60 29.5 60 35 V 43" 
        fill="none" 
        stroke="url(#goldGStroke)" 
        stroke-width="3.6" 
        stroke-linecap="round" />

  <!-- Heavy Shield-Vault Core Body -->
  <rect x="33" y="42" width="34" height="27" rx="7" 
        fill="url(#goldG)" 
        stroke="#fef08a" 
        stroke-width="1"
        filter="url(#innerShine)" />

  <!-- Futuristic Blind / Confidential Shutter Slits (Zero-Knowledge Iris) -->
  <path d="M 38 48.5 H 62" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <path d="M 38 54 H 62" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <path d="M 38 59.5 H 62" stroke="#090d16" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Central Cryptographic Keyhole Nexus -->
  <circle cx="50" cy="54" r="3.6" fill="#070b14" stroke="url(#goldG)" stroke-width="1.2" />
  <path d="M 48.6 54.5 L 47.8 62 H 52.2 L 51.4 54.5 Z" fill="#070b14" />
  <circle cx="50" cy="54" r="1.3" fill="#fde047" />

  <!-- Cryptographic Courier Orbit Nodes (Zero-Knowledge Share Guarantee) -->
  <circle cx="17.5" cy="46" r="2.2" fill="#10b981" />
  <circle cx="17.5" cy="46" r="4.5" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

  <circle cx="82.5" cy="46" r="2.2" fill="url(#cyanAccent)" />
  <circle cx="82.5" cy="46" r="4.5" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
</svg>
