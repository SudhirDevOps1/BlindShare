name: CI
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
      - name: Zero-knowledge self-check (no server-side doc decrypt)
        run: node scripts/selfcheck-e2ee.mjs
      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  mobile-build:
    # Phase-4 stub — real Capacitor build lands with apps/mobile/
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Capacitor Android build placeholder (keystore from GH Secrets b64 only)"
