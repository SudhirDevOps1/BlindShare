name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Pre-Release Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Single Source Version Parity
        run: node scripts/sync-version.mjs --check

      - name: Enterprise Security & Cryptographic E2E Tests
        run: npm test

      - name: Zero-Knowledge Self-Check
        run: node scripts/selfcheck-e2ee.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Release Notes & Generate Checksums
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            let notes = `### BlindShare ${tag}\n\nAutomated enterprise production release.`;
            
            try {
              const changelogPath = fs.existsSync('docs/CHANGELOG.md') ? 'docs/CHANGELOG.md' : (fs.existsSync('CHANGELOG.md') ? 'CHANGELOG.md' : null);
              if (changelogPath) {
                const changelog = fs.readFileSync(changelogPath, 'utf8');
                const sections = changelog.split(/\n(?=##\s+\[)/);
                const match = sections.find(s => s.includes(`## [${version}]`));
                if (match) {
                  notes = match.trim();
                }
              }
            } catch (err) {
              console.warn('Failed to parse CHANGELOG.md:', err);
            }

            fs.writeFileSync('RELEASE_NOTES.md', notes);
            console.log('Generated Release Notes:\n', notes);

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "BlindShare ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
