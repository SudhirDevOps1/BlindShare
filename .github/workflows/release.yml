name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            let notes = `### BlindShare ${tag}\n\nAutomated production release.`;
            
            try {
              const changelogPath = fs.existsSync('docs/CHANGELOG.md') ? 'docs/CHANGELOG.md' : (fs.existsSync('CHANGELOG.md') ? 'CHANGELOG.md' : null);
              if (changelogPath) {
                const changelog = fs.readFileSync(changelogPath, 'utf8');
                const sections = changelog.split(/\n(?=##\s+\[)/);
                const match = sections.find(s => s.includes(`## [${version}]`));
                if (match) {
                  notes = match.trim();
                }
              }
            } catch (err) {
              console.warn('Failed to parse CHANGELOG.md:', err);
            }

            fs.writeFileSync('RELEASE_NOTES.md', notes);
            console.log('Generated Release Notes:\n', notes);

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BlindShare ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
