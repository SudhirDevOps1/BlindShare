name: 💡 Feature Request
description: Propose a new feature, improvement, or architectural enhancement
title: "feat: [Feature Summary]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new features, cryptography enhancements, analytics capabilities, and UI improvements!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architectural Design
      description: Describe the solution you'd like to see implemented.
      placeholder: "Provide a detailed explanation of the proposed functionality..."
    validations:
      required: true
  - type: textarea
    id: zero_knowledge_impact
    attributes:
      label: Zero-Knowledge & Cryptographic Impact
      description: Does this proposed feature affect client-side encryption, key handling, or server isolation?
      placeholder: "Explain how zero-knowledge guarantees will be maintained..."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or architectural diagrams about the feature request here.
