name: 🐛 Bug Report
description: Create a report to help us improve BlindShare
title: "fix: [Bug Summary]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        > [!IMPORTANT]
        > If you have discovered a potential security vulnerability, please do NOT use this form.
        > Instead, report it privately via [GitHub Security Advisories](https://github.com/SudhirDevOps1/BlindShare/security/advisories/new) or refer to [SECURITY.md](https://github.com/SudhirDevOps1/BlindShare/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Provide a clear description of the problem...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: storage_adapter
    attributes:
      label: Storage Adapter Used
      description: Which storage backend was active when the issue occurred?
      options:
        - Local Disk Storage (/data/storage)
        - Cloudflare R2
        - Backblaze B2
        - AWS S3
        - Unknown / Not Applicable
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Version
      description: OS, Browser, Node.js version, and BlindShare version (e.g. Ubuntu 22.04, Chrome 128, Node 22, BlindShare v1.4.2).
      placeholder: "OS: Windows 11 / macOS 14 / Ubuntu 22.04, Browser: Brave / Chrome 128, BlindShare: v1.4.2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Console Logs / Terminal Output
      description: Please copy and paste any relevant console logs, network error codes, or terminal output (ensure secrets or tokens are redacted).
      render: shell
  - type: checkboxes
    id: security_check
    attributes:
      label: Security & Invariant Confirmation
      description: Please verify the following before submitting.
      options:
        - label: I have confirmed that this issue does not leak any private document keys, passwords, or session tokens.
          required: true
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
